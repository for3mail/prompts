          provider:
            prometheus:
              address: "{{args.prometheus-address}}"
              timeout: 10
              query: |-
                ((
                  ((((sum(increase(prms_http_request_seconds_count{namespace="{{args.namespace}}", appName="{{args.app-name}}", traffic_type="canary", payload="error", error_code="inner"}[2m])) or vector(0)) / sum(increase(prms_http_request_seconds_count{namespace="{{args.namespace}}", appName="{{args.app-name}}", traffic_type="canary"}[2m]))) - ((sum(increase(prms_http_request_seconds_count{namespace="{{args.namespace}}", appName="{{args.app-name}}", traffic_type="stable", payload="error", error_code="inner"}[2m])) or vector(0)) / sum(increase(prms_http_request_seconds_count{namespace="{{args.namespace}}", appName="{{args.app-name}}", traffic_type="stable"}[2m])))) >= bool 0.001)
                  * ((sum(increase(prms_http_request_seconds_count{namespace="{{args.namespace}}", appName="{{args.app-name}}", traffic_type="canary"}[2m])) * (((sum(increase(prms_http_request_seconds_count{namespace="{{args.namespace}}", appName="{{args.app-name}}", traffic_type="canary", payload="error", error_code="inner"}[2m])) or vector(0)) / sum(increase(prms_http_request_seconds_count{namespace="{{args.namespace}}", appName="{{args.app-name}}", traffic_type="canary"}[2m]))) - ((sum(increase(prms_http_request_seconds_count{namespace="{{args.namespace}}", appName="{{args.app-name}}", traffic_type="stable", payload="error", error_code="inner"}[2m])) or vector(0)) / sum(increase(prms_http_request_seconds_count{namespace="{{args.namespace}}", appName="{{args.app-name}}", traffic_type="stable"}[2m]))))) >= bool 10)
